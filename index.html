<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Great Auto Parts - Order Form</title>
  <style>
    h1 {
      text-align: center;
    }

    form {
      width: 510px;
      margin: 0 auto;
    }

    label {
      display: block;
      margin-bottom: 10px;
    }

    input,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
    }

    input:focus,
    textarea:focus {
      background-color: #fff9c4;
      border-color: #f5c400;
      outline: 2px solid #f5c400;
    }

    textarea {
      height: 200px;
      font-family: monospace;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 3px;
      background-color: black;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      form {
        width: 85%;
      }
    }
  </style>
</head>
<body>

  <h1>Great Auto Parts - Order Form</h1>

  <form>
    <label for="first-name">First Name:</label>
    <input type="text" id="first-name" name="first-name" placeholder="Enter your first name">

    <label for="last-name">Last Name:</label>
    <input type="text" id="last-name" name="last-name" placeholder="Enter your last name">

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Enter your email address">

    <label for="phone">Phone number:</label>
    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">

    <label for="make">Make:</label>
    <input type="text" id="make" name="make" placeholder="Make">

    <label for="model">Model:</label>
    <input type="text" id="model" name="model" placeholder="Model">

    <label for="year">Year:</label>
    <input type="number" id="year" name="year" placeholder="Year">

    <label for="date">Date:</label>
    <input type="date" id="date" name="date">

    <label for="part">Spare Part:</label>
    <input type="text" id="part" name="part" placeholder="Enter the spare part you need">

    <label for="quantity">Quantity:</label>
    <input type="number" id="quantity" name="quantity" min="1" placeholder="Enter the quantity of the spare part you need">

    <label for="comment">Comment:</label>
    <textarea id="comment" name="comment" placeholder="Enter your comment"></textarea>

    <button type="submit">Submit</button>
  </form>

</body>
</html>
